<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @keyframes slide1 { 0%,16%{opacity:1;transform:translateY(0)} 20%,96%{opacity:0;transform:translateY(-20px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes slide2 { 0%,16%{opacity:0;transform:translateY(20px)} 20%,36%{opacity:1;transform:translateY(0)} 40%,100%{opacity:0;transform:translateY(-20px)} }
      @keyframes slide3 { 0%,36%{opacity:0;transform:translateY(20px)} 40%,56%{opacity:1;transform:translateY(0)} 60%,100%{opacity:0;transform:translateY(-20px)} }
      @keyframes slide4 { 0%,56%{opacity:0;transform:translateY(20px)} 60%,76%{opacity:1;transform:translateY(0)} 80%,100%{opacity:0;transform:translateY(-20px)} }
      @keyframes slide5 { 0%,76%{opacity:0;transform:translateY(20px)} 80%,96%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-20px)} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 8px #a78bfa)} 50%{filter:drop-shadow(0 0 20px #a78bfa)} }
      .t1 { animation: slide1 10s ease-in-out infinite; }
      .t2 { animation: slide2 10s ease-in-out infinite; }
      .t3 { animation: slide3 10s ease-in-out infinite; }
      .t4 { animation: slide4 10s ease-in-out infinite; }
      .t5 { animation: slide5 10s ease-in-out infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .icon { animation: glow 3s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" rx="16" fill="url(#bg)"/>
  <rect width="800" height="120" rx="16" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="3" fill="#a78bfa" class="dot" opacity="0.6"/>
  <circle cx="770" cy="30" r="3" fill="#60a5fa" class="dot" opacity="0.6" style="animation-delay:0.5s"/>
  <circle cx="30" cy="90" r="3" fill="#34d399" class="dot" opacity="0.6" style="animation-delay:1s"/>
  <circle cx="770" cy="90" r="3" fill="#f472b6" class="dot" opacity="0.6" style="animation-delay:1.5s"/>

  <!-- Center divider line -->
  <line x1="100" y1="60" x2="700" y2="60" stroke="url(#line)" stroke-width="1" opacity="0.3"/>

  <!-- Static label -->
  <text x="400" y="30" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" letter-spacing="4">I SPECIALIZE IN</text>

  <!-- Animated texts -->
  <g class="t1 icon">
    <text x="400" y="75" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#a78bfa" text-anchor="middle" letter-spacing="2">🚀 Backend Development</text>
  </g>
  <g class="t2 icon">
    <text x="400" y="75" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#60a5fa" text-anchor="middle" letter-spacing="2">📱 Mobile Apps with Flutter</text>
  </g>
  <g class="t3 icon">
    <text x="400" y="75" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#34d399" text-anchor="middle" letter-spacing="2">🤖 Data Science &amp; ML</text>
  </g>
  <g class="t4 icon">
    <text x="400" y="75" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#fbbf24" text-anchor="middle" letter-spacing="2">📊 Big Data &amp; Analytics</text>
  </g>
  <g class="t5 icon">
    <text x="400" y="75" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#f472b6" text-anchor="middle" letter-spacing="2">🌐 Full Stack Web Dev</text>
  </g>

  <!-- Bottom label -->
  <text x="400" y="108" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" letter-spacing="3">HADDAR YOUSSEF · yhaddar.com</text>
</svg>
