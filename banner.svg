<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <style>
      @keyframes float0  { 0%{transform:translate(0,0)} 50%{transform:translate(18px,-22px)} 100%{transform:translate(0,0)} }
      @keyframes float1  { 0%{transform:translate(0,0)} 50%{transform:translate(-20px,15px)} 100%{transform:translate(0,0)} }
      @keyframes float2  { 0%{transform:translate(0,0)} 50%{transform:translate(14px,20px)} 100%{transform:translate(0,0)} }
      @keyframes float3  { 0%{transform:translate(0,0)} 50%{transform:translate(-16px,-18px)} 100%{transform:translate(0,0)} }
      @keyframes float4  { 0%{transform:translate(0,0)} 50%{transform:translate(22px,12px)} 100%{transform:translate(0,0)} }
      @keyframes float5  { 0%{transform:translate(0,0)} 50%{transform:translate(-12px,20px)} 100%{transform:translate(0,0)} }
      @keyframes float6  { 0%{transform:translate(0,0)} 50%{transform:translate(16px,-14px)} 100%{transform:translate(0,0)} }
      @keyframes float7  { 0%{transform:translate(0,0)} 50%{transform:translate(-20px,-10px)} 100%{transform:translate(0,0)} }
      @keyframes float8  { 0%{transform:translate(0,0)} 50%{transform:translate(10px,22px)} 100%{transform:translate(0,0)} }
      @keyframes float9  { 0%{transform:translate(0,0)} 50%{transform:translate(-18px,16px)} 100%{transform:translate(0,0)} }
      @keyframes float10 { 0%{transform:translate(0,0)} 50%{transform:translate(20px,-18px)} 100%{transform:translate(0,0)} }
      @keyframes float11 { 0%{transform:translate(0,0)} 50%{transform:translate(-14px,12px)} 100%{transform:translate(0,0)} }
      @keyframes float12 { 0%{transform:translate(0,0)} 50%{transform:translate(12px,-20px)} 100%{transform:translate(0,0)} }
      @keyframes float13 { 0%{transform:translate(0,0)} 50%{transform:translate(-22px,8px)} 100%{transform:translate(0,0)} }
      @keyframes float14 { 0%{transform:translate(0,0)} 50%{transform:translate(8px,18px)} 100%{transform:translate(0,0)} }
      @keyframes float15 { 0%{transform:translate(0,0)} 50%{transform:translate(-10px,-22px)} 100%{transform:translate(0,0)} }
      @keyframes float16 { 0%{transform:translate(0,0)} 50%{transform:translate(24px,10px)} 100%{transform:translate(0,0)} }
      @keyframes float17 { 0%{transform:translate(0,0)} 50%{transform:translate(-18px,-14px)} 100%{transform:translate(0,0)} }
      @keyframes float18 { 0%{transform:translate(0,0)} 50%{transform:translate(14px,24px)} 100%{transform:translate(0,0)} }
      @keyframes float19 { 0%{transform:translate(0,0)} 50%{transform:translate(-24px,18px)} 100%{transform:translate(0,0)} }
      @keyframes textIn  { 0%{opacity:0} 40%{opacity:0} 100%{opacity:1} }
      @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.5} }

      .p0  { animation: float0  7s ease-in-out infinite; }
      .p1  { animation: float1  9s ease-in-out infinite; }
      .p2  { animation: float2  6s ease-in-out infinite; }
      .p3  { animation: float3  8s ease-in-out infinite; }
      .p4  { animation: float4  11s ease-in-out infinite; }
      .p5  { animation: float5  7.5s ease-in-out infinite; }
      .p6  { animation: float6  10s ease-in-out infinite; }
      .p7  { animation: float7  8.5s ease-in-out infinite; }
      .p8  { animation: float8  6.5s ease-in-out infinite; }
      .p9  { animation: float9  9.5s ease-in-out infinite; }
      .p10 { animation: float10 7s ease-in-out infinite; }
      .p11 { animation: float11 8s ease-in-out infinite; }
      .p12 { animation: float12 11s ease-in-out infinite; }
      .p13 { animation: float13 6.5s ease-in-out infinite; }
      .p14 { animation: float14 9s ease-in-out infinite; }
      .p15 { animation: float15 7.5s ease-in-out infinite; }
      .p16 { animation: float16 8s ease-in-out infinite; }
      .p17 { animation: float17 10s ease-in-out infinite; }
      .p18 { animation: float18 6s ease-in-out infinite; }
      .p19 { animation: float19 9s ease-in-out infinite; }
      .title { animation: textIn 2.5s ease forwards; }
      .subtitle { animation: textIn 3.5s ease forwards; }
    </style>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-yellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0d1117"/>

  <!-- Subtle center glow -->
<!--  <ellipse cx="600" cy="140" rx="350" ry="120" fill="#1a1040" opacity="0.4"/>-->

