<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      @keyframes fadeIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
      @keyframes shimmer { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes borderPulse { 0%,100%{stroke-opacity:0.4} 50%{stroke-opacity:1} }
      .row1 { animation: fadeIn 0.8s ease forwards; }
      .row2 { animation: fadeIn 0.8s 0.2s ease both; }
      .row3 { animation: fadeIn 0.8s 0.4s ease both; }
      .row4 { animation: fadeIn 0.8s 0.6s ease both; }
      .row5 { animation: fadeIn 0.8s 0.8s ease both; }
      .border { animation: borderPulse 3s ease-in-out infinite; }
      .shimmer { animation: shimmer 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="800" height="200" rx="20" fill="url(#cardBg)"/>
  <rect width="800" height="200" rx="20" fill="none" stroke="url(#accent)" stroke-width="1.5" class="border"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#accent)"/>

  <!-- Top label -->
  <text x="40" y="35" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280" letter-spacing="4">CONTACT CARD</text>

  <!-- Divider -->
  <line x1="40" y1="45" x2="400" y2="45" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>

  <!-- Name -->
  <text x="40" y="75" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#ffffff" class="row1">HADDAR Youssef</text>
  <text x="40" y="95" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a78bfa" letter-spacing="2" class="row1">Backend &amp; Mobile Developer · Data Science &amp; ML</text>

  <!-- Contact rows -->
  <g class="row2">
    <text x="40" y="122" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af">📧  youssefhaddar9@gmail.com</text>
  </g>
  <g class="row3">
    <text x="40" y="143" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af">🌐  yhaddar.com</text>
  </g>
  <g class="row4">
    <text x="40" y="164" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af">💼  linkedin.com/in/youssef-haddar-b27766220</text>
  </g>
  <g class="row5">
    <text x="40" y="185" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9ca3af">📍  Salé, Morocco 🇲🇦</text>
  </g>

  <!-- Right decoration -->
  <circle cx="680" cy="100" r="60" fill="#a78bfa" fill-opacity="0.04"/>
  <circle cx="680" cy="100" r="40" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.2"/>
  <circle cx="680" cy="100" r="20" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.3" class="shimmer"/>
  <text x="680" y="107" font-family="'Segoe UI', sans-serif" font-size="30" text-anchor="middle" class="shimmer">👨‍💻</text>

  <!-- Corner dots -->
  <circle cx="750" cy="25" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="770" cy="25" r="2" fill="#60a5fa" opacity="0.4"/>
  <circle cx="750" cy="175" r="2" fill="#34d399" opacity="0.4"/>
  <circle cx="770" cy="175" r="3" fill="#f472b6" opacity="0.5"/>
</svg>
